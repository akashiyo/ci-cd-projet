services:

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      #- /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    
  jenkins-agent:
    build: ./docker/jenkins-agent
    container_name: jenkins-agent
    restart: unless-stopped
    init: true
    depends_on:
      - jenkins
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${JENKINS_SECRET}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - 9000:9000
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    # SonarQube nécessite souvent que vm.max_map_count soit augmenté sur l'hôte (Linux)
    #Commande : sudo sysctl -w vm.max_map_count=262144

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=1200m"
    ports:
      - 8081:8081
      - 8082:8082
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped

  # --- APPLICATION ---
  db:
    image: postgres:15-alpine
    container_name: book-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${IMAGE_BACKEND:-book-catalog-backend:local}
    container_name: book-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bookdb
      PORT: 5000
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${IMAGE_FRONTEND:-book-catalog-frontend:local}
    container_name: book-frontend
    ports:
      - 3000:80
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
  postgres_data:
